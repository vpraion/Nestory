name: Lint & Security

# Triggers
on:
  workflow_call:

# Jobs
jobs:
  lint-go:
    name: Go Lint & Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: "backend/go.mod"
          cache: false

      - name: Run golangci-lint (Format, Quality & Gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          working-directory: backend

      - name: Run govulncheck (Go CVEs)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-file: "backend/go.mod"
          work-dir: backend
